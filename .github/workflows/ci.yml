name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # `lib/` is a build artifact and is not tracked. This job is the only
      # thing that proves the published entrypoints still compile from source,
      # and that no package.json export points at a file the build never emits.
      - name: Build
        run: pnpm run build

      - name: Verify released artifact
        run: node scripts/verify-package.mjs
